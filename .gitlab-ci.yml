stages:
  - test
  - deploy

test:
  stage: test
  image: python:3.13-slim
  before_script:
    - pip install uv
    - cd /builds/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME/back
    - uv sync
    - cp .env.example .env
  script:
    - uv run pytest

deploy_to_vm:
  stage: deploy
  only:
    - main
    - backend-continuous-deployment # Only while developing the feature
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_ed25519
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $VM_HOST >> ~/.ssh/known_hosts
  script:
    - >
      ssh "$VM_USER@$VM_HOST"
      "cd ~/s2025p2-mobile-app-incidents/back &&
      git pull origin main &&
      pkill -f uv || true &&
      nohup uv run fastapi run > console.log 2>&1 & disown"
